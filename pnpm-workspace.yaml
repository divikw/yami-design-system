packages:
  - "apps/*"
  - "packages/*"

overrides:
  # Security patches for transitive dependencies (GHSA-2883-xcg3-v3hh, GHSA-mrhx-c7xc-m3w5).
  "js-yaml@3.15.1": "3.15.2"
  "@vercel/cli-config@0.3.4>zod": "4.6.7"
  # Security patches for the development-tool dependency graph.
  "brace-expansion@1.1.18": "1.1.21"
  "proxy-addr@2.0.7": "2.0.8"
  "body-parser@1.20.6": "1.20.9"
  "basic-ftp@5.3.1": "6.2.1"
  "zod@4.5.4": "4.6.7"

onlyBuiltDependencies:
  - esbuild
  - sharp
allowBuilds:
  esbuild: true
  sharp: true
