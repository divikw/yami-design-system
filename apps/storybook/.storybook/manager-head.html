<script>
  const entryUrl = new URL(window.location.href);
  const storyPath = entryUrl.searchParams.get("path");
  if (/^\/(?:docs|story)\/yami-pages-landing-page-collection-page-topic--(?:docs|pc|mobile)$/.test(storyPath)) {
    entryUrl.searchParams.set("path", storyPath.replace("collection-page-topic--", "collection-page-brand--"));
    window.history.replaceState(window.history.state, "", entryUrl);
  } else if ((entryUrl.pathname === "/" || entryUrl.pathname === "/index.html") && !storyPath) {
    entryUrl.searchParams.set("path", "/story/yami-pages-ecommerce-home--pc");
    window.history.replaceState(window.history.state, "", entryUrl);
  }
</script>
<style>
  /* Let the Docs iframe's own placeholder show through the startup overlay. */
  :has(> #preview-loader):has(+ #storybook-preview-wrapper #storybook-preview-iframe[data-is-storybook="true"][src*="viewMode=docs"]) {
    opacity: 0;
    pointer-events: none;
  }
</style>
