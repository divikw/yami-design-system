version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      playwright:
        patterns:
          - "@playwright/test"
          - "playwright"
          - "playwright-core"
      production-dependencies:
        dependency-type: production
        exclude-patterns:
          - "@playwright/test"
          - "playwright"
          - "playwright-core"
      development-dependencies:
        dependency-type: development
        exclude-patterns:
          - "@playwright/test"
          - "playwright"
          - "playwright-core"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
